<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼 생성기</title>
    <link rel="stylesheet" href="css/form-generator.css">

    <!-- SortableJS (드래그 정렬용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>

<body>

    <header class="pg-header">
        <h1>폼 생성기</h1>
    </header>

    <!-- ============================
         레퍼런스 버튼들
    ============================= -->
    <section class="reference-links">
        <a class="ref-link" href="./load.html" target="_blank">로딩 효과</a>
        <a class="ref-link" href="./cssEvent.html" target="_blank">CSS 효과</a>
        <a class="ref-link" href="./anime-js.html" target="_blank">Anime.js</a>
        <a class="ref-link" href="./slide.html" target="_blank">슬라이드 코드</a>
    </section>

    <!-- ============================
         기본 설정
    ============================= -->
    <section class="builder-panel">

        <h2 class="section-title">기본 설정</h2>

        <!-- 폼 이름 -->
        <div class="input-row">
            <label>폼 이름</label>
            <input type="text" class="form-name" placeholder="예) withus-form">
        </div>

        <!-- 기본 필드 토글 버튼 -->
        <div class="base-field-box">
            <p class="sub-title">기본 필드 선택</p>

            <div class="base-field-toggles">
                <button class="toggle-btn" data-field="name">성함</button>
                <button class="toggle-btn" data-field="phone">연락처</button>
                <button class="toggle-btn" data-field="place">지역</button>
            </div>
        </div>

    </section>

    <!-- ============================
         상세 설정
    ============================= -->
    <section class="builder-panel">

        <h2 class="section-title">상세 설정</h2>

        <div class="detail-buttons">
            <button class="btn detail-add" data-type="short">단문 입력기 추가</button>
            <button class="btn detail-add" data-type="long">장문 입력기 추가</button>
            <button class="btn detail-add" data-type="radio">단일 선택 옵션(라디오)</button>
            <button class="btn detail-add" data-type="multi">다중 선택 옵션</button>
            <button class="btn detail-add" data-type="select">Select 옵션</button>
        </div>

        <!-- 옵션 카드가 들어가는 슬롯 -->
        <div id="detail-option-container" class="detail-slot"></div>

    </section>

    <!-- ============================
         약관 URL
    ============================= -->
    <section class="builder-panel">
        <h2 class="section-title">약관 팝업 URL</h2>

        <div class="input-row">
            <label>팝업 URL</label>
            <input type="text" class="pop-url" placeholder="예) /privacy.html">
        </div>
    </section>

    <!-- ============================
         실행 버튼
    ============================= -->
    <section class="actions">
        <button id="generate" class="btn primary">폼 생성</button>
        <button id="previewBtn" class="btn outline">미리보기</button>
        <button id="copyBtn" class="btn warning">복사하기</button>
        <button id="resetBtn" class="btn danger">초기화</button>
    </section>

    <!-- ============================
         코드 출력 탭
    ============================= -->
    <section class="output-section">
        <div class="tab-buttons">
            <button class="tab-btn active" data-target="html">HTML</button>
            <button class="tab-btn" data-target="css">CSS</button>       
            <button class="tab-btn" data-target="js">JS</button>
        </div>

        <div id="result-area">폼 생성 버튼을 눌러보세요.</div>
    </section>

    <!-- 미리보기 (탭 대신 별도) -->
    <section id="preview-box" style="display:none;">
        <h3>미리보기</h3>
        <div id="preview-target"></div>
    </section>

    <!-- UI 제어 JS -->
    <script type="module" src="js/generator-ui.js"></script>

</body>
</html>
